{% extends "base.html" %}
{% set title = "Admin" %}

{% block content %}
<section class="panel">
  <h2 class="panel-title">Tenant Users</h2>
  <div class="mt-4 space-y-2">
    {% for user in users %}
      <div class="flex items-center justify-between text-sm bg-slate-800/60 rounded-lg px-4 py-2">
        <div>
          <p class="font-semibold">{{ user.email }}</p>
          <p class="text-slate-400">{{ user.role }}</p>
        </div>
        <span class="text-xs text-amber-200">{{ user.created_at.strftime('%Y-%m-%d') }}</span>
      </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
